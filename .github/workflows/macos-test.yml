name: Build macOS personal test

on:
  push:
    branches: [codex/mac-test]

permissions:
  contents: read

concurrency:
  group: macos-personal-test
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci
      - name: Run calculation tests
        run: npm test
      - name: Build ad-hoc signed app and DMG
        run: npx tauri build --bundles app,dmg --target aarch64-apple-darwin
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          hdiutil verify "$dmg_path"
          mkdir -p output/macos
          ditto -c -k --sequesterRsrc --keepParent "$app_path" output/macos/ExposureLab_0.1.2_macos_arm64-app.zip
          cp "$dmg_path" output/macos/ExposureLab_0.1.2_macos_arm64.dmg
          cd output/macos
          shasum -a 256 ExposureLab_0.1.2_macos_arm64-app.zip ExposureLab_0.1.2_macos_arm64.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ExposureLab_0.1.2_macos_arm64_personal-test
          path: output/macos/*
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
